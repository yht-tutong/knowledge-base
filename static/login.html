<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            width: 360px;
            max-width: 90vw;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
        }
        .login-box input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        .login-box input:focus {
            border-color: #4a90d9;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #357abd;
        }
        .login-box .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>知识库登录</h2>
        <p class="error" id="loginError">密码错误</p>
        <div style="position:relative;">
            <input type="password" id="loginPassword" placeholder="请输入密码" autofocus>
            <span id="togglePwd" style="position:absolute;right:12px;top:12px;cursor:pointer;user-select:none;font-size:16px;">&#x1F441;</span>
        </div>
        <button type="button" id="loginBtn">登录</button>
    </div>
    <script>
        // 重启后自动登录：检查 restart_token
        (function() {
            var token = localStorage.getItem('restart_token');
            if (token) {
                localStorage.removeItem('restart_token');
                fetch('/auth/restart-login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: token})
                }).then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code === 200) {
                        window.location.href = '/';
                    }
                }).catch(function() {});
            }
        })();
        document.getElementById('togglePwd').addEventListener('click', function() {
            var pwd = document.getElementById('loginPassword');
            var icon = document.getElementById('togglePwd');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = '&#x1F440;';
            } else {
                pwd.type = 'password';
                icon.innerHTML = '&#x1F441;';
            }
        });
        document.getElementById('loginBtn').addEventListener('click', function() {
            var pwd = document.getElementById('loginPassword').value;
            if (!pwd) return;
            fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pwd})
            }).then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.code === 200) {
                    window.location.href = '/';
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            }).catch(function() {
                document.getElementById('loginError').style.display = 'block';
            });
        });
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
